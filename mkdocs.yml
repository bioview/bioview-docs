# Project information
site_name: BioView
site_url: https://bioview.readthedocs.io
site_author: Aakash Kapoor
site_description: >-
  BioView is a cross-platform acquisition application for biomedical and human-computer interface instrumentation.

# Repository
repo_name: bioview
repo_url: https://github.com/bioview
# The header link points at the organisation, not a single repository, so no
# per-page edit links can be derived from it.
edit_uri: ""

# Source of documentation pages
docs_dir: bioview-docs

# Copyright
copyright: Copyright &copy; 2026 Aakash Kapoor

# Configuration
theme:
  name: material
  # Overrides supply the announcement bar carrying the current release version.
  custom_dir: overrides
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    # - navigation.instant
    # - navigation.instant.prefetch
    # - navigation.instant.progress
    # - navigation.prune
    - navigation.sections
    - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Inter
    code: Inter Mono
  favicon: assets/icon.png
  logo: assets/favicon.svg

extra_css:
  - stylesheets/extra.css

extra:
  # Current release. Bumped by release.sh alongside every other version stamp;
  # read by overrides/main.html for the announcement bar.
  bioview_version: 0.9.7.2
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bioview
      name: BioView on GitHub
    - icon: material/download
      link: https://github.com/bioview/bioview-installer/releases/latest
      name: Download the latest installers

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: bioview
      repo: bioview-docs
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home:
    - index.md
    - Overview: home/overview.md
    - Installation: home/installation.md
    - Quickstart: home/quickstart.md
    - Troubleshooting: home/troubleshooting.md
    - License: home/license.md
  - Architecture:
    - architecture/index.md
    - Launching: architecture/launching.md
    - Server: architecture/server.md
    - Client: architecture/client.md
    - Streaming Path: architecture/streaming.md
  - Reference:
    - reference/index.md
    - Configuration Files: reference/configuration.md
    - Channel Maps and MIMO: reference/channel-map.md
    - Signal Schemes: reference/signal-schemes.md
    - DPIC: reference/dpic.md
    - Wire Protocol: reference/protocol.md
    - Recording Format: reference/bvr-format.md
    - Monitor UI: reference/ui.md
    - Supported Devices:
      - USRP: reference/usrp.md
      - BIOPAC: reference/biopac.md
      - Microphone: reference/microphone.md
  - Contributing:
    - Guidelines: contributing/guidelines.md
    - Reporting Bugs and Issues: contributing/reporting.md
